# GEO Nginx 反向代理配置
#
# 用法：将本文件放入 nginx 配置目录（/etc/nginx/conf.d/ 或容器挂载），
#      把下方 upstream 的 7070 指向 GEO 服务地址即可。
# TLS：将 fullchain.pem 与 privkey.pem 放入 deploy/nginx/certs/，
#      然后取消下方 443 server 块的注释。
#
# 变量（可替换）：
#   GEO_SERVER_NAME  对外域名（默认 _ 匹配所有）

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 上游 GEO 应用
    upstream geo_backend {
        server geo:7070;
        keepalive 32;
    }

    # 基础日志
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # 通用 gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # 客户端请求体上限（匹配后端 readJSON 的 10MB，留余量）
    client_max_body_size 12m;

    # 代理头透传（让后端 clientIP 正确解析 X-Forwarded-For）
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ===== HTTP 80：反代 + 可选 301 跳 HTTPS =====
    server {
        listen 80;
        server_name _;

        # 启用 TLS 后取消下一行注释，强制跳转 HTTPS
        # return 301 https://$host$request_uri;

        location / {
            proxy_pass http://geo_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    120s;
        }
    }

    # ===== HTTPS 443：TLS 终止 + 反代（需证书后取消注释）=====
    # server {
    #     listen 443 ssl http2;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #
    #     location / {
    #         proxy_pass http://geo_backend;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
