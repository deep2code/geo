name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build -trimpath -ldflags "-s -w" ./cmd/geo

      - name: Go test
        run: go test -race -cover ./...

  cross-compile-check:
    name: Cross-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify cross-platform compilation
        run: |
          for osarch in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${osarch%/*} GOARCH=${osarch#*/} \
              CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /dev/null ./cmd/geo
            echo "✓ ${osarch}"
          done
