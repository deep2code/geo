# docker-compose.yml - GEO 系统编排部署
#
# 使用：docker compose up -d
# 一键启动 geo + MySQL 8.0 + Redis 7（可选缓存）

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: geo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${GEO_MYSQL_ROOT_PASSWORD:-geoRootPass}
      MYSQL_DATABASE: geo
      MYSQL_USER: geo
      MYSQL_PASSWORD: ${GEO_MYSQL_PASSWORD:-geoPass}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化时自动建 4 个业务库并授权（见 deploy/initdb/01-databases.sql）
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # 仅绑定本机，避免数据库端口暴露公网（应用容器经内部网络访问）
      - "127.0.0.1:${GEO_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${GEO_MYSQL_ROOT_PASSWORD:-geoRootPass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Redis 缓存（可选，chinacheck_cache 用）=====
  redis:
    image: redis:7-alpine
    container_name: geo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${GEO_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ===== GEO 应用 =====
  geo:
    build:
      context: .
      dockerfile: Dockerfile
    image: geo:latest
    container_name: geo-server
    restart: unless-stopped
    ports:
      # 开发直连：生产建议启用 nginx 反代（见下方 proxy profile）后注释此行。
      - "${GEO_PORT:-8080}:8080"
    env_file:
      # .env 为可选覆盖文件（含敏感配置，已被 .gitignore 忽略）。
      # 缺失时 compose 不报错，应用改用下方 environment: 默认值即可一键启动。
      - path: .env
        required: false
    environment:
      - TZ=Asia/Shanghai
      # 管理员密钥：留空时所有 /api/v1/admin/* 接口返回 403（默认安全）。
      # 本地开发需管理员接口时：export GEO_ADMIN_KEY="$(openssl rand -hex 16)"
      - GEO_ADMIN_KEY=${GEO_ADMIN_KEY:-}
      # MySQL DSN（指向 compose 内的 mysql 服务，密码与上方 MYSQL_PASSWORD 同一变量）
      - GEO_OFFLINE_MYSQL_DSN=geo:${GEO_MYSQL_PASSWORD:-geoPass}@tcp(mysql:3306)/geo_offline?parseTime=true&charset=utf8mb4&loc=Local
      - GEO_HISTORY_MYSQL_DSN=geo:${GEO_MYSQL_PASSWORD:-geoPass}@tcp(mysql:3306)/geo_history?parseTime=true&charset=utf8mb4&loc=Local
      - GEO_AUTH_MYSQL_DSN=geo:${GEO_MYSQL_PASSWORD:-geoPass}@tcp(mysql:3306)/geo_auth?parseTime=true&charset=utf8mb4&loc=Local
      - GEO_CHINACHECK_MYSQL_DSN=geo:${GEO_MYSQL_PASSWORD:-geoPass}@tcp(mysql:3306)/geo_chinacheck?parseTime=true&charset=utf8mb4&loc=Local
      # Redis（指向 compose 内的 redis 服务；chinacheck 默认用 MySQL 缓存，Redis 可选）
      - GEO_CHINACHECK_CACHE_TYPE=mysql
      # - GEO_CHINACHECK_CACHE_TYPE=redis
      # - GEO_CHINACHECK_REDIS_DSN=redis://redis:6379/0
    volumes:
      - geo-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      # P2-13：redis 不再作为启动硬依赖（chinacheck 默认 MySQL 缓存）。
      # 如启用 Redis 缓存，取消下方注释。
      # redis:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Nginx 反向代理 + TLS 终止（可选，默认不启动）=====
  # 启用：docker compose --profile proxy up -d
  # 启用后 nginx 监听 80/443，反代到内部 geo:8080；建议同时注释上方 geo 的 ports。
  # TLS 证书挂载 ./deploy/nginx/certs/（fullchain.pem + privkey.pem）。
  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    container_name: geo-nginx
    restart: unless-stopped
    ports:
      - "${GEO_HTTP_PORT:-80}:80"
      - "${GEO_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      geo:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  redis-data:
  geo-logs:
