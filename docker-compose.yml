# docker-compose.yml - GEO 系统编排部署
#
# 使用：docker compose up -d
# 一键启动 geo + MySQL 8.0 + Redis 7（异步审计队列后端 + 可选 chinacheck 缓存）

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: geo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${GEO_MYSQL_ROOT_PASSWORD:-geoRootPass}
      MYSQL_DATABASE: geo
      MYSQL_USER: geo
      MYSQL_PASSWORD: ${GEO_MYSQL_PASSWORD:-geoPass}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次初始化自动建账号/库/全部表（见 deploy/initdb/schema.sql，单文件全量）
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # 仅绑定本机，避免数据库端口暴露公网（应用容器经内部网络访问）
      - "127.0.0.1:${GEO_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${GEO_MYSQL_ROOT_PASSWORD:-geoRootPass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Redis 缓存（可选，chinacheck_cache 用）=====
  redis:
    image: redis:7-alpine
    container_name: geo-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${GEO_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ===== GEO 应用 =====
  geo:
    build:
      context: .
      dockerfile: Dockerfile
    # tag 固定 latest：构建后 `docker compose push` 即推送到 ACR（见 deploy 文档）
    image: crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/geo:latest
    container_name: geo-server
    restart: unless-stopped
    ports:
      # 开发直连：生产建议启用 nginx 反代（见下方 proxy profile）后注释此行。
      - "${GEO_PORT:-8080}:8080"
    env_file:
      # .env 为可选覆盖文件（含敏感配置，已被 .gitignore 忽略）。
      # 缺失时 compose 不报错，应用改用下方 environment: 默认值即可一键启动。
      - path: .env
        required: false
    environment:
      - TZ=Asia/Shanghai
      # 管理员密钥：留空时所有 /api/v1/admin/* 接口返回 403（默认安全）。
      # 本地开发需管理员接口时：export GEO_ADMIN_KEY="$(openssl rand -hex 16)"
      - GEO_ADMIN_KEY=${GEO_ADMIN_KEY:-}
      # MySQL DSN：单库架构，全部模块共用 geo 库（initdb 01 建库 + 02 建表）
      - GEO_OFFLINE_MYSQL_DSN=geo:${GEO_MYSQL_PASSWORD:-geoPass}@tcp(mysql:3306)/geo?parseTime=true&charset=utf8mb4&loc=Local
      - GEO_HISTORY_MYSQL_DSN=geo:${GEO_MYSQL_PASSWORD:-geoPass}@tcp(mysql:3306)/geo?parseTime=true&charset=utf8mb4&loc=Local
      - GEO_AUTH_MYSQL_DSN=geo:${GEO_MYSQL_PASSWORD:-geoPass}@tcp(mysql:3306)/geo?parseTime=true&charset=utf8mb4&loc=Local
      - GEO_CHINACHECK_MYSQL_DSN=geo:${GEO_MYSQL_PASSWORD:-geoPass}@tcp(mysql:3306)/geo?parseTime=true&charset=utf8mb4&loc=Local
      # Redis（异步审计队列后端；同时可作为 chinacheck 缓存）
      - GEO_REDIS_ADDR=redis:6379
      # 计费库（与 auth 同库；未配置时自动回退 GEO_AUTH_MYSQL_DSN）
      - GEO_BILLING_MYSQL_DSN=geo:${GEO_MYSQL_PASSWORD:-geoPass}@tcp(mysql:3306)/geo?parseTime=true&charset=utf8mb4&loc=Local
      - GEO_CHINACHECK_CACHE_TYPE=mysql
      # - GEO_CHINACHECK_CACHE_TYPE=redis
      # - GEO_CHINACHECK_REDIS_DSN=redis://redis:6379/0
    # 日志写在容器内（不挂卷，重启即清；容器日志由 logging 驱动采集）
    depends_on:
      mysql:
        condition: service_healthy
      # 异步审计队列硬依赖 Redis
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Nginx 反向代理 + TLS 终止（可选，默认不启动）=====
  # 启用：docker compose --profile proxy up -d
  # 启用后 nginx 监听 80/443，反代到内部 geo:8080；建议同时注释上方 geo 的 ports。
  # TLS 证书挂载 ./deploy/nginx/certs/（fullchain.pem + privkey.pem）。
  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    container_name: geo-nginx
    restart: unless-stopped
    ports:
      - "${GEO_HTTP_PORT:-80}:80"
      - "${GEO_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      geo:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql-data:
  redis-data:
