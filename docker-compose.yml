# GEO 一键运行（Docker Compose）
# 用法：
#   docker compose up -d
# 说明：geo 服务直接使用 ACR 公网镜像，新机器无需安装 Go/Node、无需本地构建、无需 .env 文件。
#
# 说明：
#   - mariadb 挂载 ./deploy/initdb 到 /docker-entrypoint-initdb.d，首次启动自动执行
#     schema.sql 建库建表（geo 账号口令为 docker2026ID@，与下方 GEO_MYSQL_DSN 一致）。
#   - geo 通过 environment 把连接地址改写成 compose 服务名（mariadb/redis/meilisearch），
#     若你改了 geo 账号口令，只需同步改下方 GEO_MYSQL_DSN。
#   - Meilisearch 默认无鉴权（MEILI_MASTER_KEY 为空）；如需鉴权，在本文件 geo/meilisearch
#     两处各加一行 MEILI_MASTER_KEY / GEO_MEILISEARCH_API_KEY，填同一个 openssl rand -hex 16 随机串。
#   - Meilisearch 镜像走国内同步源（华为云 SWR）锁定 v1.24.0，避免 latest 漂移 + 直连 Docker Hub 卡死。

services:
  mariadb:
    image: mariadb:11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: geoRootPass
    volumes:
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro   # 首次启动自动执行 schema.sql 建库建表
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    # 国内同步源（华为云 SWR）锁定具体版本，避免 latest 漂移 + 直连 Docker Hub 国内卡死。
    # 官方镜像为 getmeili/meilisearch:v1.24.0，如需换版本请同步改下方 tag。
    # 若机器已配 Docker Hub 加速器且能直连，可改回 getmeili/meilisearch:v1.24.0。
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/getmeili/meilisearch:v1.24.0
    # 默认无鉴权模式（development）：不设置 MEILI_MASTER_KEY，所有路由公开可访问。
    # 注意：Meilisearch 在 production 环境下【强制】要求 MEILI_MASTER_KEY（≥16 字节），
    # 否则会拒绝启动。因此默认用 development 而非 production。
    # 生产环境需鉴权时：将下方 MEILI_ENV 改为 production，并填 MEILI_MASTER_KEY 随机串
    # （openssl rand -hex 16），同时给 geo 服务加 GEO_MEILISEARCH_API_KEY 同一串。
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes: ["meili-data:/meili_data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 首次启动要加载/重建索引，可能超过 interval*retries(50s) 才 healthy；
      # 不设 start_period 会导致 geo 的 depends_on: service_healthy 一直等不到。
      start_period: 60s

  geo:
    image: crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/geo:latest
    # 零配置：连接地址用 compose 服务名，Meilisearch 默认无鉴权；
    # 若需给 Meilisearch 加鉴权，在此追加 MEILI_MASTER_KEY 并同步 GEO_MEILISEARCH_API_KEY 即可。
    environment:
      GEO_MYSQL_DSN: "geo:docker2026ID%40@tcp(mariadb:3306)/geo?parseTime=true&charset=utf8mb4&loc=Local"
      GEO_REDIS_ADDR: "redis:6379"
      GEO_MEILISEARCH_URL: "http://meilisearch:7700"
      GEO_MEILISEARCH_API_KEY: ""
      # ── 账号体系（引导类，只读环境变量，不在 DB）──
      # 默认不启用（false）；生产请在本文件同目录 .env 中设置：
      #   GEO_AUTH_ENABLED=true
      #   GEO_ADMIN_EMAIL=your_admin@example.com
      #   GEO_ADMIN_PASSWORD=<强密码，≥8位含字母数字>
      #   GEO_JWT_SECRET=$(openssl rand -hex 32)
      # 注意：启用账号体系要求数据库可用（登录用户表在 geo 库中）。
      GEO_AUTH_ENABLED: "${GEO_AUTH_ENABLED:-false}"
      GEO_ADMIN_EMAIL: "${GEO_ADMIN_EMAIL:-}"
      GEO_ADMIN_PASSWORD: "${GEO_ADMIN_PASSWORD:-}"
      GEO_JWT_SECRET: "${GEO_JWT_SECRET:-}"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "7070:7070"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7070/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

volumes:
  mariadb-data:
  redis-data:
  meili-data:
